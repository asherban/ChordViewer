name: Build and test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web-api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage
      - name: Upload product unit coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-unit-coverage
          path: coverage/
          if-no-files-found: warn
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Prepare isolated backend settings
        shell: bash
        run: |
          python3 - <<'PY'
          import os, pathlib, secrets
          os.umask(0o077)
          directory = pathlib.Path('.local/backend')
          directory.mkdir(parents=True, exist_ok=True)
          values = {'CHORDVIEWER_API_PORT': '3001'}
          for key in ('CHORDVIEWER_DB_PASSWORD', 'CHORDVIEWER_DB_ADMIN_PASSWORD', 'CHORDVIEWER_AUTH_SECRET'):
              values[key] = secrets.token_hex(32)
          (directory / 'test.env').write_text(''.join(f'{key}={value}\n' for key, value in values.items()))
          PY
      - name: Start isolated backend
        run: docker compose --project-name chordviewer-test --env-file .local/backend/test.env --file infra/backend/compose.yaml up --detach --build --wait --wait-timeout 120
      - run: npm run test:web
      - run: npm run test:api
      - run: npm audit --audit-level=high
      - name: Stop isolated backend
        if: always()
        shell: bash
        run: |
          if [ -f .local/backend/test.env ]; then
            docker compose --project-name chordviewer-test --env-file .local/backend/test.env --file infra/backend/compose.yaml down
          fi

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Install Android build packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Check native client
        run: bash apps/android/gradlew -p apps/android --no-daemon :app:testDebugUnitTest :app:testReleaseUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest :app:verifyReleaseIsolation -PdevApiUrl=http://192.168.254.253:3000
      - name: Enforce production packaging boundary
        shell: bash
        run: |
          if [ -n "$(tr -d '[:space:]' < apps/android/production-api-origin.txt)" ]; then
            # Validate release packaging with a disposable key, without production signing secrets.
            export CHORDVIEWER_KEYSTORE="$RUNNER_TEMP/chordviewer-ci-signing.p12"
            export CHORDVIEWER_STORE_PASSWORD="$(openssl rand -hex 32)"
            export CHORDVIEWER_KEY_PASSWORD="$CHORDVIEWER_STORE_PASSWORD"
            echo "::add-mask::$CHORDVIEWER_STORE_PASSWORD"
            trap 'rm -f "$CHORDVIEWER_KEYSTORE"' EXIT
            keytool -genkeypair -noprompt -storetype PKCS12 \
              -keystore "$CHORDVIEWER_KEYSTORE" \
              -storepass:env CHORDVIEWER_STORE_PASSWORD -keypass:env CHORDVIEWER_KEY_PASSWORD \
              -alias chordviewer -dname "CN=ChordViewer CI" -keyalg RSA -keysize 2048 -validity 2
            bash apps/android/gradlew -p apps/android --no-daemon :app:assembleRelease :app:bundleRelease -PdevApiUrl=http://192.168.254.253:3000
          else
            for task in assembleRelease bundleRelease; do
              if bash apps/android/gradlew -p apps/android --no-daemon ":app:$task" -PdevApiUrl=http://192.168.254.253:3000 > release-guard.log 2>&1; then
                echo "ERROR: $task succeeded without an approved production endpoint."
                exit 1
              fi
              if ! grep -q 'Production packaging is blocked: approve an HTTPS origin' release-guard.log; then
                cat release-guard.log
                exit 1
              fi
              echo "$task correctly blocked until a production origin is approved."
            done
          fi
